<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Inscripción SENA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <form id="formInscripcion" class="formulario" action="#">
      <h1>Formulario de Inscripción SENA</h1>

      <fieldset>
        <legend>Datos personales</legend>

        <div class="campo">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Ejemplo: Juan Pérez">
          <small id="error-nombre" class="error"></small>
        </div>

        <div class="campo">
          <label for="documento">Documento de Identidad</label>
          <input type="text" id="documento" name="documento" required pattern="[0-9]{6,10}" title="Debe contener entre 6 y 10 dígitos numéricos" inputmode="numeric" placeholder="Ejemplo: 1020304050">
          <small id="error-documento" class="error"></small>
        </div>

        <div class="campo">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
          <small id="error-correo" class="error"></small>
        </div>

        <div class="campo">
          <label for="telefono">Celular</label>
          <input type="tel" id="telefono" name="telefono" required pattern="3[0-9]{9}" title="10 dígitos que empiecen por 3" maxlength="10" placeholder="Ejemplo: 3001234567">
          <small id="error-telefono" class="error"></small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Curso</legend>

        <div class="campo">
          <label for="programa">Programa</label>
          <select name="programa" id="programa" required>
            <option value="">Elige una opción</option>
            <option value="adso">Análisis y Desarrollo de Software</option>
            <option value="ingles">Inglés</option>
            <option value="animacion">Animación 3D</option>
          </select>
          <small id="error-programa" class="error"></small>
        </div>

        <div class="campo">
          <span class="label-titulo">Jornada</span>
          <div class="opciones">
            <label for="manana" class="opcion">
              <input type="radio" name="jornada" id="manana" value="manana" required> Mañana
            </label>
            <label for="tarde" class="opcion">
              <input type="radio" name="jornada" id="tarde" value="tarde"> Tarde
            </label>
            <label for="noche" class="opcion">
              <input type="radio" name="jornada" id="noche" value="noche"> Noche
            </label>
          </div>
          <small id="error-jornada" class="error"></small>
        </div>

        <div class="campo campo-terminos">
          <label for="terminos" class="opcion">
            <input type="checkbox" id="terminos" name="terminos" required> Autorizo el tratamiento de mis datos personales
          </label>
          <small id="error-terminos" class="error"></small>
        </div>
      </fieldset>

      <button type="submit" class="boton">Registrarse</button>
    </form>

    <section id="resumen"></section>
  </main>
</body>
</html>
